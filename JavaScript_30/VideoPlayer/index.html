<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Custom Video Player - Pro</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <div class="player-container" tabindex="0" aria-label="Custom Video Player">
    <!-- သေချာပေါက် အလုပ်လုပ်သော HD Sample Video Link -->
    <video class="player__video viewer" src="myvideo.mp4"></video>
    <div class="player__controls">
      <!-- Progress Bar -->
      <div class="progress">
        <div class="progress__filled"></div>
      </div>

      <div class="controls__main">
        <div class="controls__left">
          <!-- Play / Pause Button -->
          <button class="player__button toggle" title="Toggle Play (Spacebar)">
            <i class="fa-solid fa-play"></i>
          </button>

          <!-- Skip Buttons -->
          <button data-skip="-10" class="player__button" title="Rewind 10s">
            <i class="fa-solid fa-rotate-left"></i> 10s
          </button>
          <button data-skip="25" class="player__button" title="Forward 25s">
            25s <i class="fa-solid fa-rotate-right"></i>
          </button>

          <!-- Time Display -->
          <span class="player__time">00:00 / 00:00</span>
        </div>

        <div class="controls__right">
          <!-- Volume Control -->
          <div class="control__group">
            <i class="fa-solid fa-volume-high volume-icon"></i>
            <input type="range" name="volume" class="player__slider" min="0" max="1" step="0.05" value="1" title="Volume">
          </div>

          <!-- Playback Rate Control -->
          <div class="control__group">
            <span class="speed-label">1x</span>
            <input type="range" name="playbackRate" class="player__slider" min="0.5" max="2" step="0.1" value="1" title="Playback Speed">
          </div>

          <!-- Fullscreen Button -->
          <button class="player__button fullscreen-btn" title="Toggle Fullscreen">
            <i class="fa-solid fa-expand"></i>
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
