<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Updater</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <h2>Image <span class="hl">Updater</span></h2>

  <div class="controls">
    <!-- Image Upload Button -->
    <label for="upload-btn" class="upload-label">
      📷 Upload
      <input type="file" id="upload-btn" accept="image/*">
    </label>

    <label for="spacing">Spacing:
      <input id="spacing" type="range" name="spacing" min="10" max="200" value="12" data-sizing="px">
    </label>

    <label for="blur">Blur:
      <input id="blur" type="range" name="blur" min="0" max="25" value="0" data-sizing="px">
    </label>

    <label for="brightness">Bright:
      <input id="brightness" type="range" name="brightness" min="0" max="200" value="100" data-sizing="%">
    </label>

    <label for="contrast">Contrast:
      <input id="contrast" type="range" name="contrast" min="0" max="200" value="100" data-sizing="%">
    </label>

    <label for="saturate">Saturate:
      <input id="saturate" type="range" name="saturate" min="0" max="200" value="100" data-sizing="%">
    </label>

    <label for="base">Color:
      <input id="base" type="color" name="base" value="#00b4d8">
    </label>

    <!-- Rotate & Flip Controls -->
    <div class="transform-container">
      <button id="rotate-btn" class="icon-btn" title="Rotate 90°">🔄</button>
      <button id="flip-h-btn" class="icon-btn" title="Flip Horizontal">↔️</button>
      <button id="flip-v-btn" class="icon-btn" title="Flip Vertical">↕️</button>
    </div>

    <!-- Aspect Ratio Toggle Buttons -->
    <div class="ratio-container">
      <button class="ratio-btn active" data-ratio="original">Auto</button>
      <button class="ratio-btn" data-ratio="1:1">1:1</button>
      <button class="ratio-btn" data-ratio="4:5">4:5</button>
      <button class="ratio-btn" data-ratio="16:9">16:9</button>
    </div>

    <!-- Preset Color Palettes -->
    <div class="palette-container">
        <button class="palette-btn ocean" data-color="#00b4d8" type="button"></button>
        <button class="palette-btn purple" data-color="#a855f7" type="button"></button>
        <button class="palette-btn pink" data-color="#ec4899" type="button"></button>
        <button class="palette-btn violet" data-color="#7c3aed" type="button"></button>
      </div>

    <!-- Reset & Download Buttons -->
    <button id="reset-btn" class="action-btn secondary-btn" title="Reset all settings">↺ Reset</button>
    <button id="download-btn" class="action-btn">💾 Download</button>
  </div>

  <!-- Drag and Drop Target Area -->
  <div class="img-wrapper" id="drop-zone">
    <div class="drop-overlay">📁 Drop Image Here</div>
    <img id="target-img" src="Nature.jpg" alt="Nature Image">
  </div>

  <script src="main.js" defer></script>
</body>
</html>
